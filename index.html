<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCC Strike - MSX2 Nemesis tribute</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; line-height: 0; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  /* subtle CRT scanlines */
  #wrap::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px, rgba(0,0,0,.18) 3px);
    background-size: 100% 3px;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="256" height="212"></canvas></div>
<script src="js/gfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
</body>
</html>
